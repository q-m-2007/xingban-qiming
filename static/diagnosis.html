<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习诊断 - 星伴·启明</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="/" class="logo">
            <div class="logo-icon">⭐</div>
            <span class="logo-text">星伴·启明</span>
        </a>
        <div class="nav-links">
            <a href="/">首页</a>
            <a href="/chat">开始学习</a>
            <a href="/diagnosis" class="active">学习诊断</a>
            <button onclick="logout()" class="btn btn-ghost">退出</button>
        </div>
    </nav>

    <div class="diagnosis-page">
        <h1 style="font-size:32px;font-weight:700;margin-bottom:32px;">学习诊断报告</h1>

        <!-- 统计卡片 -->
        <div class="diagnosis-card">
            <h2>学习统计</h2>
            <div class="profile-grid">
                <div class="profile-item">
                    <label>总题数</label>
                    <div class="value" id="stat-total">0</div>
                </div>
                <div class="profile-item">
                    <label>正确数</label>
                    <div class="value" id="stat-correct">0</div>
                </div>
                <div class="profile-item">
                    <label>正确率</label>
                    <div class="value" id="stat-accuracy">0%</div>
                </div>
            </div>
        </div>

        <!-- 认知画像 -->
        <div class="diagnosis-card">
            <h2>认知画像</h2>
            <pre id="diagnosis-content" style="font-family:monospace;font-size:14px;line-height:1.8;white-space:pre-wrap;background:var(--bg);padding:24px;border-radius:var(--radius-sm);overflow-x:auto;">加载中...</pre>
        </div>

        <!-- 返回按钮 -->
        <div style="text-align:center;margin-top:32px;">
            <a href="/chat" class="btn btn-primary">继续学习</a>
        </div>
    </div>

    <footer class="footer">
        <p>© 2026 星伴·启明 - AI智能数学辅导系统</p>
    </footer>

    <script src="/static/js/app.js"></script>
</body>
</html>
