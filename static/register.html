<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 星伴·启明</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/" class="logo" style="display:flex;justify-content:center;margin-bottom:24px;text-decoration:none;color:inherit;">
                <div class="logo-icon">⭐</div>
            </a>
            <h1>创建账号</h1>
            <p class="subtitle">开始你的智能学习之旅</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-nickname">昵称</label>
                    <input type="text" id="reg-nickname" placeholder="给自己起个名字吧">
                </div>
                <div class="form-group">
                    <label for="reg-username">用户名</label>
                    <input type="text" id="reg-username" placeholder="至少3个字符" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">密码</label>
                    <input type="password" id="reg-password" placeholder="至少6个字符" required>
                </div>
                <button type="submit" class="btn btn-primary">注册</button>
            </form>

            <div class="switch">
                已有账号？<a href="/login">立即登录</a>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
