version: '3.8'

services:
  qiming:
    build: .
    container_name: qiming-api
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=deepseek
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=deepseek-chat
      - LLM_BASE_URL=https://api.deepseek.com
      - LLM_MAX_TOKENS=500
      - LLM_TEMPERATURE=0.7
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v3/health"]
      interval: 30s
      timeout: 10s
      retries: 3
