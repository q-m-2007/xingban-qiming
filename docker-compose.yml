services:
  xingban:
    build: .
    container_name: xingban-qiming
    ports:
      - "8080:8000"
    environment:
      - LLM_PROVIDER=deepseek
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=deepseek-chat
      - LLM_BASE_URL=https://api.deepseek.com
      - LLM_MAX_TOKENS=500
      - LLM_TEMPERATURE=0.7
    volumes:
      - ./data:/app/data
    restart: unless-stopped
